[project]
name = "catalogiq-backend"
version = "0.1.0"
description = "Evidence-first product data enrichment engine for industrial commerce (UniHack - Unilog challenge)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
